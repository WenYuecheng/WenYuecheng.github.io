services:
  guestbook:
    build:
      context: ../../services/guestbook
    image: yuecheng-guestbook:local
    # Share the existing Caddy container's loopback, with no public host port.
    # Recreate this service whenever the Caddy container is recreated.
    network_mode: "container:${PORTAL_CADDY_CONTAINER:-solaceai-light-caddy-1}"
    environment:
      PORTAL_DB_PATH: /data/guestbook.sqlite3
      PORTAL_ENV: production
      PORTAL_TRUST_LOCAL_PROXY: "1"
      PORTAL_MAIL_MODE: smtp
      PORTAL_DEV_MAILBOX: "0"
      PORTAL_ADMIN_EMAIL: ${PORTAL_ADMIN_EMAIL:-}
      PORTAL_SMTP_HOST: ${PORTAL_SMTP_HOST:-}
      PORTAL_SMTP_PORT: ${PORTAL_SMTP_PORT:-587}
      PORTAL_SMTP_SECURITY: ${PORTAL_SMTP_SECURITY:-starttls}
      PORTAL_SMTP_FROM: ${PORTAL_SMTP_FROM:-}
      PORTAL_SMTP_USER: ${PORTAL_SMTP_USER:-}
      PORTAL_SMTP_PASSWORD: ${PORTAL_SMTP_PASSWORD:-}
    volumes:
      - guestbook-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

volumes:
  guestbook-data:
